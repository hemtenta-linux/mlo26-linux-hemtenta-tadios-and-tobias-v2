name: todo-api

services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Database name is missing}
      POSTGRES_USER: ${DATABASE_USER:?Database user is missing}
      POSTGRES_PASSWORD: ${PASSWORD:?Database password is missing}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    restart: unless-stopped

    environment:
      DATABASE_NAME: ${DATABASE_NAME:?Database name is missing}
      DATABASE_USER: ${DATABASE_USER:?Database user is missing}
      PASSWORD: ${PASSWORD:?Database password is missing}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s

volumes:
  postgres_data: